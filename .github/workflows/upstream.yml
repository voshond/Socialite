name: Upstream

# Weekly check for a newer wow-ui-testing release: a newer tag becomes a
# .wut-version pull request (the test suite reviews it).
#
# Uses GITHUB_TOKEN; the repository allows Actions to create pull requests.
# Pull requests opened with it trigger no workflows, so the job dispatches the
# test suite on the branch itself.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  wow-ui-testing:
    name: wow-ui-testing release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Propose the newest wow-ui-testing release
        run: |
          repository=voshond/wow-ui-testing
          pinned="$(grep -v '^[[:space:]]*\(#\|$\)' .wut-version | head -n 1 | awk '{ print $1 }')"
          refs="$(git ls-remote --tags "https://github.com/$repository.git")"
          tag="$(sed -n 's|.*refs/tags/\(v[0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' <<<"$refs" | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then
            echo "::error::No release tags in $repository."
            exit 1
          fi
          latest="$(awk -v ref="refs/tags/$tag^{}" '$2 == ref { print $1 }' <<<"$refs")"
          [ -n "$latest" ] || latest="$(awk -v ref="refs/tags/$tag" '$2 == ref { print $1 }' <<<"$refs")"
          printf '| Library | Pinned | Newest release | Status |\n|---|---|---|---|\n| wow-ui-testing | `%s` | `%s` @ `%s` | %s |\n' "${pinned:0:7}" "$tag" "${latest:0:7}" \
            "$([ "$pinned" = "$latest" ] && echo current || echo behind)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pinned" = "$latest" ]; then exit 0; fi
          printf '%s # %s\n' "$latest" "$tag" > .wut-version
          branch=upstream/wow-ui-testing
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add .wut-version
          git commit -q -m "Bump wow-ui-testing to $tag" \
            -m "Generated by the Upstream workflow from $repository $latest."
          git push -q --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$branch" --title "Bump wow-ui-testing to $tag" --body "## Summary
          - Pins \`.wut-version\` to $repository \`$tag\` (\`$latest\`).
          - The library's pinned Blizzard client source, API snapshot and atlas table come with it.

          Review the [library changes](https://github.com/$repository/compare/$pinned...$latest). Regenerate the atlas subset and install and check the client before merging when the build changes behaviour."
          fi
          gh workflow run tests.yml --ref "$branch"
