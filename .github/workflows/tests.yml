name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: LuaJIT test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Cache wow-ui-testing
        uses: actions/cache@v4
        with:
          path: .wut
          key: wut-${{ hashFiles('.wut-version', 'tests/wut.config.lua') }}
      - name: Fetch wow-ui-testing
        run: bash scripts/fetch-wut.sh
        env:
          GITHUB_TOKEN: ${{ secrets.WUT_TOKEN || github.token }}
      - name: Run all tests and addon syntax checks
        run: bash scripts/run-tests.sh --times -j
